name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies and formatting
        run: |
          go mod download
          go mod tidy -diff
          go mod verify
          test -z "$(gofmt -l cmd internal tests)"

      - name: Run Go tests and vet
        run: |
          go vet ./...
          go test ./...

      - name: Run instrumented CLI E2E coverage
        env:
          GOCOVERDIR: ${{ runner.temp }}/eventctl-coverage
        run: |
          mkdir -p "$GOCOVERDIR"
          go test ./tests/e2e -tags=e2e -p 1 -timeout 10m -count=1
          go tool covdata textfmt -i="$GOCOVERDIR" -o "$RUNNER_TEMP/eventctl.coverage"
          go tool cover -func="$RUNNER_TEMP/eventctl.coverage"
          test "$(go tool cover -func="$RUNNER_TEMP/eventctl.coverage" | awk '$1 == "total:" {print $3}')" = "100.0%"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eventctl-coverage
          path: |
            ${{ runner.temp }}/eventctl.coverage
            ${{ runner.temp }}/eventctl-coverage
          if-no-files-found: error
