name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: eventctl / e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod

      - name: Set up pinned mise
        uses: ./.github/actions/setup-mise

      - name: Verify dependencies and formatting
        run: |
          go mod download
          go mod tidy -diff
          go mod verify
          test -z "$(gofmt -l cmd internal protocol tests)"

      - name: Run static checks
        run: go vet ./...

      - name: Run canonical CLI E2E coverage
        run: mise run test

      - name: Upload coverage artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eventctl-coverage
          path: |
            coverage/e2e.profile
            coverage/e2e
          if-no-files-found: error
