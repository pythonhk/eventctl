name: Release

on:
  push:
    tags:
      - v*

permissions: {}

env:
  SYFT_CHECK_FOR_APP_UPDATE: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    if: github.repository == 'pythonhk/eventctl'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_digest: ${{ steps.metadata.outputs.source_digest }}
      source_date: ${{ steps.metadata.outputs.source_date }}
    steps:
      - name: Check out the tag and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/verify-tag.sh "${GITHUB_REF_NAME}"

      - name: Record release metadata
        id: metadata
        run: |
          source_digest=$(git rev-parse --verify "${GITHUB_REF_NAME}^{commit}")
          {
            printf 'version=%s\n' "${GITHUB_REF_NAME#v}"
            printf 'source_digest=%s\n' "$source_digest"
            printf 'source_date=%s\n' \
              "$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$source_digest")"
          } >>"$GITHUB_OUTPUT"

      - name: Load pinned tool versions
        id: tools
        run: scripts/release/load-tool-versions.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - name: Install pinned Go security scanner
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ steps.tools.outputs.govulncheck }}
          printf '%s\n' "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Run complete Go gates on exact release source
        run: scripts/check.sh

      - name: Fuzz exact release source
        env:
          FUZZ_TIME: 10s
        run: scripts/release/fuzz-smoke.sh

      - name: Run complete Bash and workflow gates
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
          go run mvdan.cc/sh/v3/cmd/shfmt@${{ steps.tools.outputs.shfmt }} -d -ci scripts
          go run github.com/rhysd/actionlint/cmd/actionlint@${{ steps.tools.outputs.actionlint }}
          scripts/release/check-action-pins.sh
          scripts/release/test-release-boundaries.sh

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: ${{ steps.tools.outputs.syft }}

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ steps.tools.outputs.goreleaser }}
          install-only: true

      - name: Build twice and prove exact release reproducibility
        run: |
          goreleaser check
          scripts/release/check-reproducible.sh \
            "${{ steps.metadata.outputs.version }}" release

      - name: Store release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eventctl-release-${{ steps.metadata.outputs.version }}
          path: dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  native-preflight:
    name: Native preflight (${{ matrix.platform }}/${{ matrix.architecture }})
    needs: build
    if: github.repository == 'pythonhk/eventctl'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
            runner: ubuntu-24.04
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: darwin
            architecture: amd64
            runner: macos-15-intel
          - platform: darwin
            architecture: arm64
            runner: macos-15
          - platform: windows
            architecture: amd64
            runner: windows-2025
          - platform: windows
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        id: tools
        shell: bash
        run: scripts/release/load-tool-versions.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: false

      - name: Run native source tests on exact release commit
        shell: bash
        run: go test -mod=readonly -count=1 ./...

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventctl-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify and execute native binary
        shell: bash
        run: >-
          scripts/release/verify-asset.sh
          dist
          "${{ needs.build.outputs.version }}"
          "${{ matrix.platform }}"
          "${{ matrix.architecture }}"
          "${{ needs.build.outputs.source_digest }}"
          "${{ needs.build.outputs.source_date }}"

  publish:
    name: Attest and publish immutable release
    needs:
      - build
      - native-preflight
    if: github.repository == 'pythonhk/eventctl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eventctl-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Revalidate candidate and create asset-complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/verify-tag.sh "${GITHUB_REF_NAME}"
          scripts/release/publish-draft.sh "${GITHUB_REF_NAME}" dist "${GITHUB_REPOSITORY}"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest darwin amd64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_darwin_amd64.tar.gz
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_darwin_amd64.tar.gz.spdx.json

      - name: Attest darwin arm64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_darwin_arm64.tar.gz
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_darwin_arm64.tar.gz.spdx.json

      - name: Attest linux amd64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_linux_amd64.tar.gz
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_linux_amd64.tar.gz.spdx.json

      - name: Attest linux arm64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_linux_arm64.tar.gz
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_linux_arm64.tar.gz.spdx.json

      - name: Attest windows amd64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_windows_amd64.zip
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_windows_amd64.zip.spdx.json

      - name: Attest windows arm64 SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/eventctl_${{ needs.build.outputs.version }}_windows_arm64.zip
          sbom-path: dist/eventctl_${{ needs.build.outputs.version }}_windows_arm64.zip.spdx.json

      - name: Publish and prove immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/finalize-release.sh
          "${GITHUB_REF_NAME}"
          "${GITHUB_REPOSITORY}"
          dist
          "${{ needs.build.outputs.source_digest }}"

  published-release-record:
    name: Verify GitHub release record
    needs:
      - build
      - publish
    if: github.repository == 'pythonhk/eventctl'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/release/verify-release-record.sh
          "${GITHUB_REF_NAME}"
          "${GITHUB_REPOSITORY}"
          "${{ needs.build.outputs.source_digest }}"

  published-native:
    name: Re-download (${{ matrix.platform }}/${{ matrix.architecture }})
    needs:
      - build
      - publish
      - published-release-record
    if: github.repository == 'pythonhk/eventctl'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
            extension: tar.gz
            runner: ubuntu-24.04
          - platform: linux
            architecture: arm64
            extension: tar.gz
            runner: ubuntu-24.04-arm
          - platform: darwin
            architecture: amd64
            extension: tar.gz
            runner: macos-15-intel
          - platform: darwin
            architecture: arm64
            extension: tar.gz
            runner: macos-15
          - platform: windows
            architecture: amd64
            extension: zip
            runner: windows-2025
          - platform: windows
            architecture: arm64
            extension: zip
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download published asset and checksum contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/require-gh-version.sh
          gh release verify "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          mkdir -p dist
          asset="eventctl_${{ needs.build.outputs.version }}_${{ matrix.platform }}_${{ matrix.architecture }}.${{ matrix.extension }}"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$asset" \
            --pattern SHA256SUMS \
            --dir dist

      - name: Verify immutable release asset and hosted attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/eventctl_${{ needs.build.outputs.version }}_${{ matrix.platform }}_${{ matrix.architecture }}.${{ matrix.extension }}"
          gh release verify-asset "${GITHUB_REF_NAME}" "$asset" \
            --repo "${GITHUB_REPOSITORY}"
          gh release verify-asset "${GITHUB_REF_NAME}" dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"
          scripts/release/verify-attestations.sh \
            "$asset" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_REF_NAME}" \
            "${{ needs.build.outputs.source_digest }}"

      - name: Verify checksum, archive shape, metadata, and native execution
        shell: bash
        run: |
          scripts/release/verify-asset.sh \
            dist \
            "${{ needs.build.outputs.version }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.architecture }}" \
            "${{ needs.build.outputs.source_digest }}" \
            "${{ needs.build.outputs.source_date }}"
