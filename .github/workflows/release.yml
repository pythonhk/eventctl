name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'pythonhk/eventctl'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version-file: go.mod

      - name: Set up pinned mise
        uses: ./.github/actions/setup-mise

      - name: Verify the exact tagged source
        run: mise run test

      - name: Build checksum-pinned archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            directory="dist/eventctl_${version}_${os}_${arch}"
            mkdir -p "$directory"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/pythonhk/eventctl/internal/buildinfo.Version=${version} -X github.com/pythonhk/eventctl/internal/buildinfo.Commit=${COMMIT}" \
              -o "$directory/eventctl" ./cmd/eventctl
            tar -C "$directory" -czf "dist/eventctl_${version}_${os}_${arch}.tar.gz" eventctl
            rm -rf "$directory"
          done
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
